<head>
	<title>Galaxy Helper</title>
	<meta name="viewport" content="user-scalable=no, width=device-width">
	<meta charset="UTF-8">

	<link href="css/bootstrap.min.css" rel="stylesheet" >
	<link href="css/style.css" rel="stylesheet" type="text/css">

	<script src="js/jquery.min.js"></script>
	<script src="js/bootstrap.min.js"></script>

	<style>
		.galaxy-input {text-align:center;height:1.5em;width:1.5em;font-size:30}
	</style>
</head>

<body>
	<br/><br/><br/>
	WORD: <input id="L1" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;
	<input id="L2" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;
	<input id="L3" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;
	<input id="L4" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;
	<input id="L5" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;
	<input id="L6" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;
	<input id="L7" class="galaxy-input" type="text" maxlength="1">&nbsp;&nbsp;

	<button onclick="clear_input(0)">Clear</button>&nbsp;&nbsp;
	<br/><br/>
	<div id="total" style="width:90%"></div>
</body>

<script>
$('.galaxy-input').change(function() {
	$("#total").html(get_matches(get_cur_regex()));
});
clear_input = function() { $(".galaxy-input").val(""); $("#total").html(""); }

get_matches = function (regex = "") {
	var result = '<div class="container text-center"><div class="row"><div class="col-sm-2"><b>3-Letters<\/b><span style="font-family:Courier;font-size:20px">';
	var cur_length = 3;
	if (regex === undefined || regex.trim().length == 0) { return "<b style='color:red'>Invalid Input // No Results Found.<\/b>"; }
	var re = new RegExp(("\\\|(" + regex.replaceAll("?","[a-z]*").replaceAll("!","[a-z]") + ")\\\|"), "gi");
	var answers = "|ant||ape||arm||bug||bat||bus||bag||bee||bed||box||boy||bow||big||can||cap||car||cat||cot||cow||cry||cup||cut||day||dig||dog||dot||dry||ear||eat||eye||egg||fly||fry||fog||fix||fan||gym||hug||hat||hop||hot||ice||ill||jet||jam||joy||job||jog||key||kid||law||lid||man||map||mat||mix||mud||nap||net||pad||pay||pen||pet||pin||rag||raw||red||rug||run||sun||sad||say||sea||sew||shy||ski||son||spy||tie||top||tow||toy||wet||win||zoo||baby||bump||bird||bake||band||bowl||bank||bone||bath||bear||beam||bark||bell||bike||boat||cold||cage||cake||call||camp||chew||city||cook||cute||clap||doll||dive||farm||fish||flag||food||game||gift||gold||half||home||hope||itch||joke||jump||king||kite||lake||lazy||lion||lock||loud||mask||moon||nail||nose||oven||page||park||path||peek||pest||pull||push||plan||play||poor||pony||room||race||rain||read||road||ring||ride||rich||swim||soft||shop||star||sign||sing||stop||sail||sink||slow||safe||seal||sell||sled||snow||twin||tiny||test||tent||trip||taxi||talk||walk||wish||wall||wild||wing||yard||yell||award||alone||atlas||block||bench||brick||broom||beach||bagel||broom||cabin||candy||chair||child||class||clean||climb||clock||clown||count||crazy||crown||dance||diary||drink||dream||earth||equal||favor||fence||float||floor||fruit||giant||glass||glove||house||horse||igloo||jelly||knife||large||lucky||magic||medal||mouth||movie||music||money||night||ocean||paper||point||prize||paint||party||piano||plate||puppy||queen||radio||robot||ruler||river||scale||score||scrub||shelf||shine||silly||skate||sleep||snack||small||smart||smile||story||sound||speak||sport||straw||scare||space||stage||storm||stamp||stand||trick||train||think||twist||tiger||uncle||visit||video||wagon||whale||windy||wheel||zebra||asleep||artist||animal||button||bucket||bridge||bounce||bubble||branch||basket||bottom||bottle||cactus||camera||candle||carpet||castle||cavity||cereal||circus||closet||crayon||dinner||double||dragon||escape||flower||finger||family||frozen||forest||friend||future||father||garden||garage||giggle||hammer||helmet||honest||hungry||island||jungle||karate||ladder||letter||mother||museum||magnet||marble||mirror||napkin||office||palace||parade||parent||picnic||pillow||pirate||planet||puppet||puddle||puzzle||polish||poster||pretty||racket||recipe||report||reward||riddle||rocket||smooth||spring||summer||scream||season||secret||shadow||soccer||statue||sloppy||street||shovel||shrink||silent||sister||strong||switch||strike||trophy||tunnel||travel||turtle||ticket||winter||weight||wallet||yellow||zipper||airport||acrobat||address||baggage||balloon||bicycle||battery||brother||cartoon||chicken||compass||contest||diamond||dentist||disease||explore||factory||feather||garbage||healthy||haunted||history||holiday||husband||imagine||journey||kitchen||laundry||lecture||library||liberty||machine||message||miracle||monster||morning||mystery||pajamas||picture||pitcher||pretend||private||problem||program||promise||rainbow||scratch||shelter||strange||stretch||stadium||scooter||special||traffic||thunder||tourist||thirsty||tornado||theater||wrestle||wedding||whisper||warning||witness||welcome|";
	while (null != (z = re.exec(answers))) {
		if (z[1].length > cur_length) {
			cur_length = z[1].length;
			result += '<\/span><\/div><div class="col-sm-2"><b>' + cur_length + '-Letters<\/b><span style="font-family:Courier;font-size:20px">';
		}
		result += "<br/>" + z[1].toUpperCase();
	}
	if (result.trim().length == 0) { return "<b style='color:red'>No Results Found.<\/b>"; }
	return result + "<\/span><\/div><\/div>";
}

get_cur_regex = function () {
	var result = "";
	for (var i = 1; i < 8; i++) {
		var new_letter = "?";
		var letter = $("#L" + i).val();
		if (letter !== undefined && letter.trim().length == 1) {
			new_letter = letter.trim().toLowerCase();
			result = result.replaceAll("?","!");
		}
		result += new_letter;
	}
	return result;
}
</script>
